<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin - Design and Craft Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--ink:#1C2340;--mute:#5B6180;--gold:#B8892D;--card:#FFFFFF;--line:#E3E0D8;--btn:#1C2340;--btnt:#FAF9F6;--rose:#B5445B;--ok:#2F7D5B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162B;--ink:#F1EEE6;--mute:#A4A9C4;--gold:#D9AE55;--card:#1B2040;--line:#2E3558;--btn:#D9AE55;--btnt:#12162B;--rose:#E0768C;--ok:#5FBF93}}
:root[data-theme="dark"]{--bg:#12162B;--ink:#F1EEE6;--mute:#A4A9C4;--gold:#D9AE55;--card:#1B2040;--line:#2E3558;--btn:#D9AE55;--btnt:#12162B;--rose:#E0768C;--ok:#5FBF93}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.top b{font-size:18px}
.va{font-size:13px;color:var(--mute)}
select,input{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:16px}
select{max-width:200px}
#nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
#nav button{white-space:nowrap;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
#nav button[aria-selected=true]{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
main{padding:20px 0 48px}
h2{font-size:26px;margin:0 0 4px;line-height:1.2}
h3{font-size:17px;margin:20px 0 8px}
.mute{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);padding:14px}
.st b{display:block;font-size:34px;line-height:1.1}
.st.ok{border-top-color:var(--ok)}.st.no{border-top-color:var(--rose)}
.card,.req{background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.card{padding:14px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:14px;cursor:pointer}
.bd{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;border:1.5px solid;white-space:nowrap}
.bd.wait{color:var(--gold);border-color:var(--gold)}.bd.ok{color:var(--ok);border-color:var(--ok)}.bd.no{color:var(--rose);border-color:var(--rose)}.bd.mid{color:var(--mute);border-color:var(--mute)}
.dd{padding:0 14px 14px;border-top:1px solid var(--line)}
.f{display:grid;gap:10px;margin:12px 0}
@media(min-width:600px){.f{grid-template-columns:repeat(3,1fr)}}
.f label{font-size:14px;font-weight:600}
.f input{width:100%;margin-top:4px;font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.rj{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chips button{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--gold);background:var(--gold);color:#1C2340}
.err{color:var(--rose);font-weight:600;margin:6px 0 0}
.flex{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.scroll{overflow-x:auto}
.log{font-size:14px;color:var(--mute);padding-left:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:16px}
.msg{padding:8px 12px;border-radius:10px;margin:8px 0;max-width:85%;font-size:15px}
.msg small{color:var(--mute);font-weight:600}
.msg.c{background:var(--bg);border:1px solid var(--line)}
.msg.b{background:var(--bg);border:1px dashed var(--mute);margin-left:auto}
.msg.p{background:var(--btn);color:var(--btnt);margin-left:auto}
.msg.p small{color:inherit;opacity:.8}
.rl{display:flex;gap:10px;align-items:center;margin:8px 0}
.rl input,td input[type=checkbox]{width:20px;height:20px;padding:0}
.bar{display:grid;grid-template-columns:130px 1fr 24px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bar i{display:block;height:14px;background:var(--gold)}
[hidden]{display:none!important}
a.btn{text-decoration:none;display:inline-block}
.btn:disabled{opacity:.4;cursor:not-allowed}
header{z-index:9}
#nav{display:flex;flex-direction:column;gap:4px;overflow:visible;padding:0}
#nav button{width:100%;text-align:left;border:0;border-radius:8px;padding:11px 14px;white-space:normal}
#side{position:fixed;top:0;bottom:0;left:0;width:250px;background:var(--bg);border-right:1px solid var(--line);padding:calc(72px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:8;transform:translateX(-100%);transition:transform .2s}
#side.open{transform:none}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:7;display:none}
#ov.open{display:block}
.mb{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;display:flex}
body.out #side,body.out .mb{display:none}
@media(min-width:900px){#side{transform:none;z-index:4;padding-top:calc(76px + env(safe-area-inset-top,0px))}.mb{display:none}#ov{display:none!important}#mn{margin-left:250px}header .wrap{max-width:none}}
</style>
</head>

var ACC={founder:['overview','requests','customers','sync','team'],designer:['overview','requests'],packaging:['sync'],advisor:['overview'],advertising:['overview']};
var TN={overview:'Overview',requests:'Requests inbox',customers:'Customers',sync:'Sync status',team:'Team and roles'};
var RL={founder:'Founder and main controller',designer:'Designer',packaging:'Packaging and delivery',advisor:'Advisor',advertising:'Advertising'};
var me=null,prof=null,mode='boot',tab='overview',filt='All',openId=null,err='',msg='',busy=false;
var R=[],CU=[],PF=[],LG=[],INV={n:'',e:'',r:'designer'};
var needPw=/type=(invite|recovery)/.test(location.hash);

function find(id){return R.filter(function(r){return r.id==id})[0]}
function cnt(f){return R.filter(f).length}
function bc(s){return {'Pending':'wait','Accepted':'ok','Rejected':'no','Changes asked':'mid'}[s]}
function cname(r){return (r.customers&&r.customers.name)||'Customer'}
function menu(o){var s=$('side'),v=(o===undefined)?!s.classList.contains('open'):o;s.classList.toggle('open',v);$('ov').classList.toggle('open',v);$('mb').setAttribute('aria-expanded',v)}
function go(t){tab=t;err='';msg='';menu(false);render()}
function openReq(id){tab='requests';filt='All';openId=id;err='';render()}
function tog(id){openId=openId==id?null:id;err='';render()}
function setF(f){filt=f;render()}
function fnErr(x){
 if(x.data&&x.data.error)return Promise.resolve(x.data.error);
 if(x.error&&x.error.context&&x.error.context.json)return x.error.context.json().then(function(j){return j.error||'Something went wrong.'}).catch(function(){return 'Something went wrong.'});
 if(x.error)return Promise.resolve('Something went wrong.');
 return Promise.resolve('')}

function render(){
 document.body.className=mode=='app'?'in':'out';
 if(mode!='app'){menu(false);$('nav').innerHTML='';$('top2').hidden=true;$('v').innerHTML=V0[mode]();return}
 $('top2').hidden=false;$('who').textContent=prof.full_name;
 var a=ACC[prof.role];if(a.indexOf(tab)<0)tab=a[0];
 $('nav').innerHTML=a.map(function(t){return '<button role="tab" aria-selected="'+(t==tab)+'" onclick="go(\''+t+'\')">'+TN[t]+'</button>'}).join('');
 $('v').innerHTML=V[tab]()}

/* ---------- sign in ---------- */
function card(inner){return '<div class="card" style="max-width:380px;margin:30px auto"><div style="text-align:center">'+logo(64)+inner}
var V0={
boot:function(){return '<p class="mute" style="text-align:center;margin-top:60px">Loading...</p>'},
login:function(){return card('<h2>Partner sign in</h2></div><label class="va">Email<input id="lm" type="email" autocomplete="username" style="width:100%;margin:4px 0 12px"></label><label class="va">Password<input id="lp" type="password" autocomplete="current-password" style="width:100%;margin:4px 0 12px"></label><p class="err" id="le" role="alert"></p><button class="btn" style="width:100%" onclick="login()">Sign in</button><p style="text-align:center"><button class="btn alt" style="border:0;font-weight:400" onclick="forgot()">Forgot password?</button></p><p class="mute" style="font-size:14px">Accounts are made by invitation only. Ask Aias to invite you.</p></div>')},
setpw:function(){return card('<h2>Set your password</h2></div><label class="va">New password (8 or more characters)<input id="np" type="password" autocomplete="new-password" style="width:100%;margin:4px 0 12px"></label><label class="va">Type it again<input id="np2" type="password" autocomplete="new-password" style="width:100%;margin:4px 0 12px"></label><p class="err" id="le" role="alert"></p><button class="btn" style="width:100%" onclick="setpw()">Save password</button></div>')},
noaccess:function(){return card('<h2>No access</h2></div><p>This account is not active. Ask Aias to switch it on.</p><button class="btn" style="width:100%" onclick="out()">Sign out</button></div>')}
};
function login(){var e=$('lm').value.trim(),p=$('lp').value;
 if(!e||!p){$('le').textContent='Enter your email and password.';return}
 $('le').textContent='';
 sb.auth.signInWithPassword({email:e,password:p}).then(function(r){
  if(r.error){$('le').textContent='The email or password is not right.';return}
  me=r.data.user;start()})}
function forgot(){var e=$('lm').value.trim();
 if(!e){$('le').textContent='Type your email first, then press Forgot password.';return}
 sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(){$('le').textContent='If this email has an account, a reset link has been sent.'})}
function setpw(){var p=$('np').value,q=$('np2').value;
 if(p.length<8){$('le').textContent='Use at least 8 characters.';return}
 if(p!=q){$('le').textContent='The two passwords are different.';return}
 sb.auth.updateUser({password:p}).then(function(r){
  if(r.error){$('le').textContent=r.error.message;return}
  history.replaceState(null,'',location.pathname);needPw=false;start()})}
function out(){sb.auth.signOut().then(function(){me=null;prof=null;mode='login';render()})}

function start(){
 sb.from('profiles').select('*').eq('id',me.id).maybeSingle().then(function(r){
  if(!r.data||!r.data.active){mode='noaccess';render();return}
  prof=r.data;tab=ACC[prof.role][0];mode='app';render();loadAll()})}
function loadAll(){
 var q=[sb.from('requests').select('*, customers(name,phone)').order('created_at',{ascending:false}),
  sb.from('customers').select('*').order('created_at',{ascending:false}),
  sb.from('sync_log').select('*, requests(ref)').order('created_at',{ascending:false}).limit(20)];
 if(prof.role=='founder')q.push(sb.from('profiles').select('*').order('created_at'));
 return Promise.all(q).then(function(a){R=a[0].data||[];CU=a[1].data||[];LG=a[2].data||[];PF=a[3]?(a[3].data||[]):[];render()})}

/* ---------- requests ---------- */
function save(r){r.price=$('pr').value;r.advance=$('ad').value;r.due=$('du').value}
function act(id,a){var r=find(id);if(busy)return;
 if(a=='Accepted'){
  save(r);
  if(!(+r.price>0)||!r.due){err='Add the final price and the deadline before accepting.';render();return}
  busy=true;
  sb.from('requests').update({status:'Accepted',price:+r.price,advance:(r.advance===''||r.advance==null)?null:+r.advance,due:r.due,decided_by:prof.id}).eq('id',id).then(function(x){
   if(x.error){busy=false;err=x.error.message;render();return}
   return sb.functions.invoke('sync-partner',{body:{request_id:id,target:'Lead'}}).then(function(){busy=false;openId=null;err='';return loadAll()})})
 }else{
  busy=true;
  sb.from('requests').update({status:a,decided_by:prof.id}).eq('id',id).then(function(x){
   busy=false;if(x.error)err=x.error.message;else{openId=null;err=''}return loadAll()})}}
function syncTo(id,t){if(busy)return;busy=true;msg='';
 sb.functions.invoke('sync-partner',{body:{request_id:id,target:t}}).then(function(x){
  return fnErr(x).then(function(m){busy=false;err=m;return loadAll()})})}

function detail(r){
 var h='<div class="dd"><p>'+esc(r.details)+'</p><p class="mute">Phone '+esc(r.customers&&r.customers.phone)+(r.deadline_wanted?' · Customer wants it by '+esc(r.deadline_wanted):'')+'</p>';
 if(r.status=='Pending'||r.status=='Changes asked'){
  h+='<div class="f"><label>Final price (BDT)<input id="pr" type="number" min="0" value="'+esc(r.price)+'"></label><label>Advance (BDT)<input id="ad" type="number" min="0" value="'+esc(r.advance)+'"></label><label>Deadline<input id="du" type="date" value="'+esc(r.due)+'"></label></div>';
  if(err)h+='<p class="err" role="alert">'+esc(err)+'</p>';
  h+='<div class="row"><button class="btn" onclick="act(\''+esc(r.id)+'\',\'Accepted\')">Accept</button><button class="btn alt" onclick="act(\''+esc(r.id)+'\',\'Changes asked\')">Ask for changes</button><button class="btn rj" onclick="act(\''+esc(r.id)+'\',\'Rejected\')">Reject</button></div>'}
 else if(r.status=='Accepted')h+='<p>Price BDT '+esc(r.price)+'. Advance BDT '+esc(r.advance==null?'-':r.advance)+'. Deadline '+esc(r.due)+'.</p>';
 else h+='<p class="mute">This request was rejected and nothing was sent to the partners website.</p>';
 return h+'</div>'}

/* ---------- partners website links (saved in this browser) ---------- */
function pget(k){try{return localStorage.getItem('dcm_pw_'+k)||''}catch(e){return ''}}
function pset(k,v){try{localStorage.setItem('dcm_pw_'+k,v)}catch(e){}render()}
function pw(){function b(k,t){var u=pget(k);return u.indexOf('http')==0?'<a class="btn alt" href="'+esc(u)+'" target="_blank" rel="noopener">'+t+'</a>':'<button class="btn alt" disabled>'+t+'</button>'}
 return '<div class="card"><b>Partners website</b><div class="f"><label>Leads page address<input placeholder="https://..." value="'+esc(pget('l'))+'" onchange="pset(\'l\',this.value.trim())"></label><label>Orders page address<input placeholder="https://..." value="'+esc(pget('o'))+'" onchange="pset(\'o\',this.value.trim())"></label></div><div class="row">'+b('l','Open Leads')+b('o','Open Orders')+'</div></div>'}

/* ---------- team ---------- */
function invite(){
 INV.n=$('in').value.trim();INV.e=$('ie').value.trim();INV.r=$('ir').value;
 if(INV.n.length<2||!INV.e){err='Enter a name and an email.';msg='';render();return}
 if(busy)return;busy=true;err='';msg='';
 sb.functions.invoke('invite-partner',{body:{full_name:INV.n,email:INV.e,role:INV.r}}).then(function(x){
  return fnErr(x).then(function(m){busy=false;if(m)err=m;else{msg='Invite sent to '+INV.e+'.';INV={n:'',e:'',r:'designer'}}return loadAll()})})}
function setActive(id,v){if(busy)return;busy=true;
 sb.from('profiles').update({active:v}).eq('id',id).then(function(x){busy=false;err=x.error?x.error.message:'';return loadAll()})}
function cl(q){q=(q||'').toLowerCase();
 return CU.filter(function(c){return (c.name+' '+c.phone).toLowerCase().indexOf(q)>=0}).map(function(c){
  var n=R.filter(function(r){return r.customer_id==c.id}).length;
  return '<div class="card flex"><span><b>'+esc(c.name)+'</b><br><span class="mute">'+esc(c.phone)+' · '+esc(c.source)+' · since '+esc(fmt(c.created_at))+'</span></span><span>'+(n>1?'<span class="bd ok">Repeat customer</span> ':'')+'<span class="bd mid">'+n+(n==1?' request':' requests')+'</span></span></div>'}).join('')||'<p class="mute">No customers found.</p>'}

var V={
overview:function(){
 var list=R.filter(function(r){return r.status=='Pending'}),
 h='<h2>Overview</h2><div class="stats"><div class="st"><b>'+list.length+'</b>Pending</div><div class="st ok"><b>'+cnt(function(r){return r.status=='Accepted'})+'</b>Accepted</div><div class="st no"><b>'+cnt(function(r){return r.status=='Rejected'})+'</b>Rejected</div><div class="st no"><b>'+cnt(function(r){return r.status=='Accepted'&&r.sync_status!='Sent'})+'</b>Not sent to partners site</div></div><h3>Needs your action</h3>';
 if(!list.length)h+='<p class="mute">No pending requests.</p>';
 list.forEach(function(r){h+='<div class="card flex"><span><b>'+esc(cname(r))+'</b><br><span class="mute">'+esc(r.product)+' · '+esc(r.source)+'</span></span>'+(ACC[prof.role].indexOf('requests')>=0?'<button class="btn" onclick="openReq(\''+esc(r.id)+'\')">Open</button>':'')+'</div>'});
 return h},
requests:function(){
 var h='<h2>Requests inbox</h2><div class="chips">'+['All','Pending','Accepted','Rejected','Changes asked'].map(function(f){return '<button aria-pressed="'+(f==filt)+'" onclick="setF(\''+f+'\')">'+f+'</button>'}).join('')+'</div>';
 var list=R.filter(function(r){return filt=='All'||r.status==filt});
 if(!list.length)h+='<p class="mute">Nothing here.</p>';
 list.forEach(function(r){h+='<div class="req"><button class="rh" aria-expanded="'+(openId==r.id)+'" onclick="tog(\''+esc(r.id)+'\')"><span><b>'+esc(cname(r))+' · '+esc(r.ref)+'</b><br><span class="mute">'+esc(r.product)+' · '+esc(r.source)+' · '+esc(fmt(r.created_at))+'</span></span><span class="bd '+bc(r.status)+'">'+esc(r.status)+'</span></button>'+(openId==r.id?detail(r):'')+'</div>'});
 return h},
customers:function(){return '<h2>Customers</h2><p class="mute">Everyone who has sent a request.</p><div class="row"><input placeholder="Search name or phone" aria-label="Search customers" oninput="$(\'cl\').innerHTML=cl(this.value)" style="flex:1;min-width:0"></div><div id="cl" style="margin-top:12px">'+cl('')+'</div>'},
sync:function(){
 var h='<h2>Sync status</h2><p class="mute">Accepted requests sent to the Leads and Orders sections of the partners website.</p>'+pw();
 if(err)h+='<p class="err" role="alert">'+esc(err)+'</p>';
 var list=R.filter(function(r){return r.status=='Accepted'});
 if(!list.length)h+='<p class="mute">No accepted requests yet.</p>';
 var canSend=['founder','designer'].indexOf(prof.role)>=0;
 list.forEach(function(r){var st=r.sync_status||'Not sent';
  h+='<div class="card"><div class="flex"><span><b>'+esc(r.ref)+' · '+esc(cname(r))+'</b><br><span class="mute">'+esc(r.product)+' · BDT '+esc(r.price)+'</span></span><span><span class="bd mid">'+esc(r.sync_target)+'</span> <span class="bd '+(st=='Sent'?'ok':'no')+'">'+esc(st)+'</span></span></div>';
  if(canSend)h+='<div class="row">'+(st!='Sent'?'<button class="btn" onclick="syncTo(\''+esc(r.id)+'\',\''+esc(r.sync_target)+'\')">Retry send</button>':'')+(st=='Sent'&&r.sync_target=='Lead'?'<button class="btn alt" onclick="syncTo(\''+esc(r.id)+'\',\'Order\')">Advance received</button>':'')+'</div>';
  h+='</div>'});
 h+='<h3>Recent activity</h3><ul class="log">'+(LG.length?LG.map(function(l){return '<li>'+esc(l.requests&&l.requests.ref)+' · '+esc(l.target)+' · '+esc(l.status)+(l.response?' ('+esc(l.response)+')':'')+' · '+esc(fmt(l.created_at))+'</li>'}).join(''):'<li>Nothing yet.</li>')+'</ul>';
 return h},
team:function(){
 var h='<h2>Team and roles</h2><p class="mute">Invite a partner by email. They get a link to set their own password.</p><div class="card"><b>Invite a partner</b><div class="f"><label>Name<input id="in" value="'+esc(INV.n)+'"></label><label>Email<input id="ie" type="email" value="'+esc(INV.e)+'"></label><label>Role<select id="ir" style="width:100%;max-width:none;margin-top:4px">'+Object.keys(RL).map(function(k){return '<option value="'+k+'"'+(k==INV.r?' selected':'')+'>'+RL[k]+'</option>'}).join('')+'</select></label></div>';
 if(err)h+='<p class="err" role="alert">'+esc(err)+'</p>';
 if(msg)h+='<p style="color:var(--ok);font-weight:600">'+esc(msg)+'</p>';
 h+='<div class="row"><button class="btn" onclick="invite()">Send invite</button></div></div><h3>People</h3>';
 PF.forEach(function(p){h+='<div class="card flex"><span><b>'+esc(p.full_name)+'</b><br><span class="mute">'+esc(RL[p.role]||p.role)+'</span></span><span><span class="bd '+(p.active?'ok':'mid')+'">'+(p.active?'Active':'Switched off')+'</span> '+(p.id==prof.id?'':'<button class="btn alt" onclick="setActive(\''+esc(p.id)+'\','+(!p.active)+')">'+(p.active?'Switch off':'Switch on')+'</button>')+'</span></div>'});
 return h+'<h3>Who sees what</h3><div class="scroll"><table><tr><th>Role</th><th>Sections</th></tr>'+Object.keys(ACC).map(function(k){return '<tr><td>'+RL[k]+'</td><td>'+ACC[k].map(function(t){return TN[t]}).join(', ')+'</td></tr>'}).join('')+'</table></div>'}
};

sb.auth.getSession().then(function(r){
 if(r.data.session){me=r.data.session.user;if(needPw){mode='setpw';render()}else start()}
 else{mode='login';render()}});
sb.auth.onAuthStateChange(function(ev){if(ev=='SIGNED_OUT'){me=null;prof=null;mode='login';render()}});
render();

</script>
</body>
